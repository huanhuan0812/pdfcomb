name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 关键：tkinterdnd2 会附带 tkdnd 二进制，用 --collect-all 才能正确打包
      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --clean --name PDFMerger `
            --collect-all tkinterdnd2 `
            --hidden-import pypdf `
            pdf.py

      - name: Verify output
        run: |
          if (Test-Path "dist\PDFMerger.exe") {
            Get-Item "dist\PDFMerger.exe" | Format-List Name, Length
          } else {
            Write-Error "未生成 exe"
            exit 1
          }
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFMerger-windows-x64
          path: dist/PDFMerger.exe
          if-no-files-found: error
